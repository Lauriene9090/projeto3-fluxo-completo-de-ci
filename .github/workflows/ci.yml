name: CI

on:  #triggers
  pull_request:
    branches:
      - develop
    paths: #particpam do test no action 
      - 'src/**/*'
      - 'test/**'
      - 'package.json'
      - 'package-lock.json'
    path-ignore: # nao participam do test no action
      - 'README.md'    
env:
  PORT: ${{vars.PORT}}
  API_TOKEN: ${{ secrets.API_TOKEN }}       

jobs:
 test:
    runs-on: ubuntu-latest
    steps:
      - name: checkout no código
        uses: actions/checkout@v4

      - name: Instalar Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalar dependências
        run: npm install

      - name: roda os testes
        run: npm test

 build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: checkout no código
        uses: actions/checkout@v4

      - name: Instalar Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalar dependências
        run: npm install

      - name: roda o build
        run: npm run build        